name: 🚀 Deploy ChannelMe Clinic Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # 1️⃣ BUILD
  # ==========================================
  build:
    name: 🔨 Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Verify project
        run: npm --version

  # ==========================================
  # 2️⃣ TEST
  # ==========================================
  test:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test --if-present

  # ==========================================
  # 3️⃣ DEPLOY TO RENDER
  # ==========================================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 🚀 Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: ✅ Deployment triggered
        run: echo "ChannelMe backend deployment triggered successfully!"